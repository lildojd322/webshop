<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webshop</title>
    <link rel="icon" href="./svg/3176363.png">
    <link rel="stylesheet" href="./main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="./navStyles.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bytesized&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Heebo:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Yantramanav:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="nav">

        <input id="burger-toggle" type="checkbox">
        <label class="label" for="burger-toggle">
            <span></span>
        </label>

        <ul class="header__list">
            <li>
                <a href="./main.html" class="header__link">Главная</a>
            </li>
            <li>
                <button class="add-my-product-button">
                    <a href="./newProduct.html">добавить свой товар</a>
                </button>
            </li>
            <li>
                <div class="price-range">
                    <div class="price-title">Цена, ₽</div>
                    <div class="price-input-group">
                        <label class="price-label">От</label>
                        <input type="number" class="price-input" id="first-input">
                    </div>
                    <div class="price-input-group">
                        <label class="price-label">До</label>
                        <input type="number" class="price-input" id="second-input">
                    </div>
                    <button class="range-button">применить</button>
                </div>
            </li>
        </ul>


        <div class="search-container">
            <input type="text" placeholder="Найти" class="search-product">
        </div>

    
        <div class="nav-right">
            <a href="./cartPage.html" class="cart">
                <img src="./svg/Frame 217.svg" width="25" height="25" alt="cart">
                <span class="square-cart"></span>
            </a>
            <select name="" id="">
                <option value="все товары" selected>все товары</option>
                <option value="быт">быт</option>
                <option value="одежда">одежда</option>
                <option value="книги">книги</option>
                <option value="техника">техника</option>
                <option value="аксессуары">аксессуары</option>
                <option value="искусство">искусство</option>
                <option value="другое">другое</option>
            </select>
        </div>
    </nav>
    <section class="main">
        <div class="products-container">
        </div>
    </section>

    <script type="module" src="./shopPage.js"></script>
    <script src="./newProduct.js"></script>
    <script src="./select.js"></script>
    <script src="./search.js"></script>
    <script type="module" src="./cartProductsCounter.js"></script>
</body>

</html>
